<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank DApp</title>
    <!-- เรียกใช้ไลบรารี Ethers.js สำหรับเชื่อมต่อ Smart Contract -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ethers/6.13.2/ethers.umd.min.js"></script>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 40px auto; padding: 20px; background: #f4f4f9; }
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 15px; }
        button { background: #007bff; color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 10px; }
        button:hover { background: #0056b3; }
        input { width: 100%; padding: 10px; margin-top: 5px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
        .info { background: #e9ecef; padding: 10px; border-radius: 5px; margin-bottom: 15px; font-size: 14px; }
    </style>
</head>
<body>

    <div class="card">
        <h2>🏦 ระบบธนาคาร (Bank DApp)</h2>
        <!-- แสดงรหัสนักศึกษา และ ชื่อ-สกุล ตามโจทย์ -->
        <div class="info">
            <strong>รหัสนักศึกษา:</strong> 66066639 <br>
            <strong>ชื่อ-สกุล:</strong> นายพีระพล คูณมา
        </div>

        <button onclick="connectWallet()">1. เชื่อมต่อ MetaMask</button>
        <p id="walletAddress" style="font-size: 13px; color: green; word-break: break-all;">สถานะ: ยังไม่ได้เชื่อมต่อ</p>
    </div>

    <div class="card">
        <h3>ตรวจสอบยอดเงิน (Check Balance)</h3>
        <button onclick="checkBalance()">เช็กยอดเงินคงเหลือ</button>
        <p id="balanceDisplay" style="font-weight: bold; font-size: 18px; margin-top: 10px;">ยอดเงิน: - Wei</p>
    </div>

    <div class="card">
        <h3>ฝากเงิน (Deposit)</h3>
        <label>จำนวนเงิน (หน่วย Wei):</label>
        <input type="number" id="depositAmount" placeholder="เช่น 1000">
        <button onclick="depositMoney()">ฝากเงินเข้าธนาคาร</button>
    </div>

    <div class="card">
        <h3>ถอนเงิน (Withdraw)</h3>
        <label>จำนวนเงินที่ต้องการถอน (หน่วย Wei):</label>
        <input type="number" id="withdrawAmount" placeholder="เช่น 500">
        <button onclick="withdrawMoney()" style="background: #dc3545;">ถอนเงิน</button>
    </div>

    <script>
        const contractAddress = "0xC6226C05066559a46387f77fa3F4A3e9639418EB";

        const contractABI = [
            "function deposit() public payable",
            "function withdraw(uint amount) public",
            "function checkBlance() public view returns (uint balance)"
        ];

        let provider, signer, bankContract;

        // ฟังก์ชันเชื่อมต่อ MetaMask
        async function connectWallet() {
            if (window.ethereum) {
                try {
                    provider = new ethers.BrowserProvider(window.ethereum);
                    signer = await provider.getSigner();
                    const address = await signer.getAddress();
                    document.getElementById("walletAddress").innerText = "เชื่อมต่อแล้ว: " + address;
                    
                    // เชื่อมต่อ Smart Contract
                    bankContract = new ethers.Contract(contractAddress, contractABI, signer);
                } catch (err) {
                    alert("เชื่อมต่อไม่สำเร็จ: " + err.message);
                }
            } else {
                alert("กรุณาติดตั้ง MetaMask ก่อนใช้งาน!");
            }
        }

        // ฟังก์ชันฝากเงิน (Deposit)
        async function depositMoney() {
            if (!bankContract) return alert("กรุณากดเชื่อมต่อ MetaMask ก่อน!");
            const amount = document.getElementById("depositAmount").value;
            if (!amount || amount <= 0) return alert("กรุณากรอกจำนวนเงินให้ถูกต้อง");

            try {
                const tx = await bankContract.deposit({ value: amount });
                alert("กำลังส่งธุรกรรม กรุณารอสักครู่...");
                await tx.wait();
                alert("ฝากเงินสำเร็จ!");
                checkBalance();
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
            }
        }

        // ฟังก์ชันถอนเงิน (Withdraw)
        async function withdrawMoney() {
            if (!bankContract) return alert("กรุณากดเชื่อมต่อ MetaMask ก่อน!");
            const amount = document.getElementById("withdrawAmount").value;
            if (!amount || amount <= 0) return alert("กรุณากรอกจำนวนเงินให้ถูกต้อง");

            try {
                const tx = await bankContract.withdraw(amount);
                alert("กำลังส่งธุรกรรม กรุณารอสักครู่...");
                await tx.wait();
                alert("ถอนเงินสำเร็จ!");
                checkBalance();
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + (err.reason || err.message));
            }
        }

        // ฟังก์ชันเช็กยอดเงิน (CheckBlance)
        async function checkBalance() {
            if (!bankContract) return alert("กรุณากดเชื่อมต่อ MetaMask ก่อน!");
            try {
                const balance = await bankContract.checkBlance();
                document.getElementById("balanceDisplay").innerText = `ยอดเงิน: ${balance.toString()} Wei`;
            } catch (err) {
                alert("เกิดข้อผิดพลาด: " + err.message);
            }
        }
    </script>
</body>
</html>
